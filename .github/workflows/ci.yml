name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  version:
    name: Calendar version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check canonical and derived versions
        run: make version-check

  docs:
    name: Documentation authoring gate (Emacs 31.1, Texinfo 7.2)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: '31.1'
      - name: Install Texinfo
        run: sudo apt-get update && sudo apt-get install --yes texinfo
      - name: Verify authoring toolchain
        run: makeinfo --version | grep --fixed-strings 'texi2any (GNU texinfo) 7.2'
      - name: Render every manual without Emacsvox byte-code
        run: |
          make docs-org-check
          for docs_manual in \
            emacsvox emacsvox-reference emacsvox-heritage \
            introducing-emacspeak; do
            make docs-preview DOCS_MANUAL="$docs_manual"
          done
      - name: Reproduce checked Info output
        run: |
          make -B docs-update
          git diff --exit-code -- info/emacsvox-body.texi info/*.info*
      - name: Check documentation utilities and public local links
        run: |
          emacs -Q --batch -L utils -L test \
            -l utils/emacsvox-docs-check.el \
            -l test/emacsvox-docs-check-tests.el \
            -f ert-run-tests-batch-and-exit
          emacs -Q --batch -L utils \
            -l utils/emacsvox-docs-check.el \
            --eval '(emacsvox-docs-check--check-local-links default-directory)'

  byte-compile:
    name: Byte-compile (Emacs ${{ matrix.emacs }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs: ['29.4', '30.1']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Byte-compile all elisp files
        run: |
          cd lisp
          make config 2>/dev/null || true
          emacs --batch \
            --eval '(setq byte-compile-error-on-warn nil)' \
            --eval '(push default-directory load-path)' \
            -l emacsvox-preamble.el \
            -l emacsvox-loaddefs.el \
            -f batch-byte-compile \
            emacsvox-version.el emacsvox.el \
            tts-speak.el voice-setup.el voice-defs.el \
            emacsvox-speak.el emacsvox-advice.el emacsvox-sounds.el \
            emacsvox-keymap.el emacsvox-pronounce.el
