name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  windows-staging:
    name: Isolated Windows staging fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check staging, provenance, and failure boundaries
        run: make windows-staging-test

  debian-package:
    name: Debian package and Ubuntu installation
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: '30.2'
      - name: Verify source archive contents and installation
        run: |
          make source-archive-test
          mkdir -p dist
          archive="dist/emacsvox-$(cat VERSION).tar.bz2"
          git archive --format=tar --prefix="emacsvox-$(cat VERSION)/" HEAD | bzip2 -9 > "$archive"
          make source-archive-check
      - name: Check and build development package
        run: |
          make deb-test
          make deb
      - name: Install and remove in disposable Ubuntu
        run: |
          set -- dist/emacsvox_*_all.deb
          package=$1
          docker run --rm -v "$PWD:/source:ro" ubuntu:26.04 \
            sh /source/test/debian-install-smoke.sh "/source/$package"
      - uses: actions/upload-artifact@v4
        with:
          name: emacsvox-debian-development
          path: |
            dist/emacsvox_*_all.deb
            dist/emacsvox_*_all.deb.sha256

  version:
    name: Release metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check canonical and derived versions
        run: make version-check headers-check

  docs:
    name: Documentation authoring gate (Emacs 31.1, Texinfo 7.2)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: '31.1'
      - name: Install Texinfo
        run: sudo apt-get update && sudo apt-get install --yes texinfo
      - name: Verify authoring toolchain
        run: makeinfo --version | grep --fixed-strings 'texi2any (GNU texinfo) 7.2'
      - name: Render every manual without Emacsvox byte-code
        run: |
          make docs-org-check
          for docs_manual in \
            emacsvox emacsvox-reference emacsvox-heritage \
            introducing-emacspeak; do
            make docs-preview DOCS_MANUAL="$docs_manual"
          done
      - name: Reproduce checked Info output
        run: |
          make -B docs-update
          git diff --exit-code -- info/emacsvox-body.texi info/*.info*
      - name: Check documentation utilities and public local links
        run: |
          emacs -Q --batch -L utils -L test \
            -l utils/emacsvox-docs-check.el \
            -l test/emacsvox-docs-check-tests.el \
            -f ert-run-tests-batch-and-exit
          emacs -Q --batch -L utils \
            -l utils/emacsvox-docs-check.el \
            --eval '(emacsvox-docs-check--check-local-links default-directory)'

  core-speech:
    name: Core speech and transport (Emacs ${{ matrix.emacs }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.2', '31.1']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Run core regressions, speech traces, and compiled Aural checks
        run: |
          emacs_binary=$(command -v emacs)
          core_home="$RUNNER_TEMP/emacsvox-core-home"
          mkdir -p "$core_home"
          env HOME="$core_home" make core-test EMACS="$emacs_binary"
          env HOME="$core_home" make trace-test EMACS="$emacs_binary"
          env HOME="$core_home" make compiled-aural-test EMACS="$emacs_binary"

  integrations:
    name: Agent Shell, Notmuch, and EAT (Emacs ${{ matrix.emacs }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs: '30.2'
            sha256: b3f36f18a6dd2715713370166257de2fae01f9d38cfe878ced9b1e6ded5befd9
          - emacs: '31.1'
            sha256: 1da5790d9580c81932b5bf700633114468da7b3412d69faa767daebf974f4586
    steps:
      - uses: actions/checkout@v4
      # purcell/setup-emacs supplies terminal-only builds. These jobs need X11.
      - name: Install graphical Emacs build and test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev \
            libgnutls28-dev libxml2-dev libncurses-dev libxpm-dev libgif-dev texinfo \
            ca-certificates curl xz-utils xvfb xauth fonts-dejavu-core
      - uses: actions/cache@v4
        id: graphical-emacs
        with:
          path: ${{ runner.temp }}/emacs-${{ matrix.emacs }}
          key: graphical-emacs-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ matrix.emacs }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Build pinned graphical Emacs
        if: steps.graphical-emacs.outputs.cache-hit != 'true'
        env:
          EMACS_VERSION: ${{ matrix.emacs }}
          EMACS_SHA256: ${{ matrix.sha256 }}
        run: |
          build_dir=$(mktemp -d "$RUNNER_TEMP/emacs-build.XXXXXX")
          archive="$build_dir/emacs.tar.xz"
          curl --fail --location --retry 3 \
            "https://ftp.gnu.org/gnu/emacs/emacs-$EMACS_VERSION.tar.xz" -o "$archive"
          printf '%s  %s\n' "$EMACS_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" --strip-components=1 -C "$build_dir"
          cd "$build_dir"
          ./configure --prefix="$RUNNER_TEMP/emacs-$EMACS_VERSION" \
            --with-x-toolkit=gtk3 --without-native-compilation --without-sound --without-dbus
          make -j2
          make install
      - name: Select and verify graphical Emacs
        env:
          EMACS_VERSION: ${{ matrix.emacs }}
        run: |
          emacs_binary="$RUNNER_TEMP/emacs-$EMACS_VERSION/bin/emacs"
          "$emacs_binary" -Q --batch --eval \
            '(unless (and (equal emacs-version (getenv "EMACS_VERSION")) (featurep (quote x))) (error "Expected the pinned Emacs release with X11 support"))'
          echo "$RUNNER_TEMP/emacs-$EMACS_VERSION/bin" >> "$GITHUB_PATH"
      - name: Verify preparation and run pinned integrations
        run: |
          emacs_binary=$(command -v emacs)
          integration_home="$RUNNER_TEMP/emacsvox-integration-home"
          mkdir -p "$integration_home"
          env HOME="$integration_home" make test-deps-test EMACS="$emacs_binary"
          env HOME="$integration_home" make test-deps EMACS="$emacs_binary"
          env HOME="$integration_home" make integration-test EMACS="$emacs_binary"
      - name: Run pinned graphical Agent Shell regressions
        run: |
          emacs_binary=$(command -v emacs)
          integration_home="$RUNNER_TEMP/emacsvox-integration-home"
          env HOME="$integration_home" make graphical-integration-test EMACS="$emacs_binary"

  compatibility:
    name: Build and compatibility (Emacs ${{ matrix.emacs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.2', '31.1']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Build every maintained module and check compatibility
        run: |
          emacs_binary=$(command -v emacs)
          compat_home="$RUNNER_TEMP/emacsvox-compat-home"
          mkdir -p "$compat_home"
          env HOME="$compat_home" make -j2 bytecode EMACS="$emacs_binary"
          env HOME="$compat_home" make compat-test EMACS="$emacs_binary"
          env HOME="$compat_home" make bytecode-check EMACS="$emacs_binary"
